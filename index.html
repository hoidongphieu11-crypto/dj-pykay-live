<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DJ PYKAY MEME BAR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;color:#fff;font-family:Arial,sans-serif}#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 17%,#6530a955,transparent 30%),linear-gradient(#060817 0 42%,#080713 42% 100%)}
#status{position:absolute;top:1.6%;left:3%;z-index:30;font-size:11px;opacity:.8}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f44;margin-right:5px}.connected{background:#27e37c}
.truss{position:absolute;top:5%;left:-5%;width:110%;height:36px;border-top:5px solid #555;border-bottom:5px solid #333;transform:perspective(250px) rotateX(45deg);opacity:.8}.lamp{position:absolute;top:8%;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 16px 7px #8b5cff}.lamp:nth-of-type(1){left:12%}.lamp:nth-of-type(2){left:30%}.lamp:nth-of-type(3){left:50%}.lamp:nth-of-type(4){left:70%}.lamp:nth-of-type(5){left:88%}
#dj{position:absolute;top:7%;left:50%;transform:translateX(-50%);text-align:center;z-index:7;width:100%}.logo{font-size:clamp(31px,9vw,58px);font-weight:1000;letter-spacing:4px;text-shadow:0 0 10px #00eaff,0 0 28px #a000ff}.sub{font-size:11px;letter-spacing:4px;opacity:.75}.booth{position:relative;margin:18px auto 0;width:76%;max-width:420px;height:128px;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);border:2px solid #20eaff;background:linear-gradient(90deg,#061d34dd,#1d0734dd);box-shadow:0 0 18px #00d9ff,inset 0 0 24px #a000ff;display:grid;place-items:center;font-size:24px;font-weight:900}.booth:before{content:"🎛️  ◉ ◉  🎚️  ◉ ◉  🎛️";position:absolute;top:12px;left:8%;right:8%;font-size:17px;letter-spacing:5px;color:#9ff;text-shadow:0 0 8px #00eaff}.booth:after{content:"DJ PYKAY";position:absolute;bottom:27px;left:0;right:0;font-size:25px;text-shadow:0 0 12px #ff00d4}.eq{position:absolute;bottom:8px;left:8%;right:8%;height:12px;background:repeating-linear-gradient(90deg,#00efff 0 5px,transparent 5px 10px);opacity:.7}
.laser{position:absolute;top:15%;left:50%;width:3px;height:65%;transform-origin:top;opacity:.55;filter:blur(.4px);animation:sweep 2.5s ease-in-out infinite alternate}.l1{background:#00eaff;transform:rotate(34deg)}.l2{background:#ff00c8;transform:rotate(-34deg);animation-delay:-1.2s}.l3{background:#7b5cff;transform:rotate(12deg);animation-delay:-.6s}@keyframes sweep{to{opacity:.9;filter:blur(1.5px)}}
#floor{position:absolute;left:-15%;right:-15%;bottom:-8%;height:62%;background:linear-gradient(#ffffff14 1px,transparent 1px),linear-gradient(90deg,#ffffff14 1px,transparent 1px),linear-gradient(135deg,#071833,#17051f);background-size:42px 42px,42px 42px,100% 100%;transform:perspective(360px) rotateX(55deg);transform-origin:bottom;box-shadow:inset 0 45px 80px #7400ff25}
#crowd{position:absolute;left:0;right:0;bottom:3%;height:53%;z-index:12}.meme{position:absolute;width:58px;height:76px;filter:drop-shadow(0 5px 4px #000);animation:dance .42s ease-in-out infinite alternate;transform-origin:50% 100%}.head{position:absolute;top:0;left:5px;width:48px;height:48px;border-radius:46% 46% 43% 43%;background:#f4f4f4;border:2px solid #111;display:grid;place-items:center;font-size:30px;overflow:hidden}.body{position:absolute;top:43px;left:15px;width:30px;height:29px;border:2px solid #111;border-radius:10px 10px 5px 5px;background:var(--shirt,#eee)}.arm{position:absolute;top:48px;width:22px;height:7px;background:#eee;border:2px solid #111;border-radius:9px}.arm.a{left:0;transform:rotate(-28deg)}.arm.b{right:0;transform:rotate(28deg)}.leg{position:absolute;top:68px;width:8px;height:17px;background:#eee;border:2px solid #111}.leg.a{left:19px;transform:rotate(9deg)}.leg.b{right:19px;transform:rotate(-9deg)}@keyframes dance{from{transform:translateY(0) rotate(-7deg)}to{transform:translateY(-15px) rotate(7deg) scale(1.05)}}
.fx{position:absolute;pointer-events:none;z-index:35;font-size:34px;animation:fly 1.7s ease-out forwards}@keyframes fly{to{transform:translateY(-380px) scale(1.6) rotate(25deg);opacity:0}}#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:31}.flash{animation:flash .4s}@keyframes flash{0%{opacity:.65}100%{opacity:0}}#banner{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:40;font-size:27px;font-weight:1000;text-align:center;text-shadow:0 0 18px #ff00cc}.show{animation:banner 1.5s}@keyframes banner{20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.4);opacity:0}}#count{position:absolute;bottom:1%;width:100%;text-align:center;z-index:25;font-size:10px;opacity:.65}
.barwall{position:absolute;inset:28% 0 38%;z-index:2;background:linear-gradient(90deg,#16052788,#061b3188,#25062588);border-top:1px solid #b64cff55;border-bottom:1px solid #00eaff44}.barwall:before{content:"MUSIC CONNECTS PEOPLE";position:absolute;left:2%;top:16%;width:22%;font-size:13px;font-weight:900;line-height:1.45;color:#ff4be7;text-shadow:0 0 9px #ff00d4}.barwall:after{content:"GOOD VIBES • LIVE MUSIC • ALL NIGHT";position:absolute;right:2%;top:16%;width:22%;font-size:12px;font-weight:900;line-height:1.5;color:#56eaff;text-shadow:0 0 9px #00d9ff}.speaker{position:absolute;top:27%;width:42px;height:155px;z-index:6;border:2px solid #26283d;background:radial-gradient(circle,#111 0 10px,#313348 11px 15px,#080910 16px 21px,transparent 22px) 50% 10px/40px 48px repeat-y;background-color:#090a12;box-shadow:0 0 18px #5b27ff88}.speaker.left{left:3%}.speaker.right{right:3%}.vip{position:absolute;bottom:5%;width:95px;height:52px;z-index:14;border:2px solid #b752ff;border-radius:50%;background:#090814dd;box-shadow:0 0 18px #c000ff;color:#ffd57a;text-align:center;padding-top:15px;font-weight:900}.vip.left{left:-15px}.vip.right{right:-15px}</style></head><body><div id="stage"><div id="status"><span id="dot" class="dot"></span><span id="statusText">Đang kết nối...</span></div><div class="truss"></div><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><div class="laser l1"></div><div class="laser l2"></div><div class="laser l3"></div><div class="barwall"></div><div class="speaker left"></div><div class="speaker right"></div><div id="dj"><div class="logo">DJ PYKAY</div><div class="sub">MEME DANCE CLUB</div><div class="booth"><div class="eq"></div></div></div><div id="floor"></div><div class="vip left">♛ VIP</div><div class="vip right">♛ VIP</div><div id="crowd"></div><div id="flash"></div><div id="banner"></div><div id="count">🔥 MEME DANCE FLOOR • LIVE</div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),crowd=document.getElementById("crowd"),dot=document.getElementById("dot"),statusText=document.getElementById("statusText"),flash=document.getElementById("flash"),banner=document.getElementById("banner");const faces=["😂","😎","🤪","😡","🥴","😏","😭","🤓","😱","😈","🗿","🥸","😵‍💫","🤡","😤","😜"];const shirts=["#fff","#ff5f8f","#4fd4a5","#ffd34e","#5ba8ff","#b975ff"];let events=0;
function addMeme(big=false){const d=document.createElement("div");d.className="meme";d.style.left=(2+Math.random()*88)+"%";d.style.bottom=(Math.random()*70)+"%";d.style.animationDelay=(-Math.random())+"s";d.style.setProperty("--shirt",shirts[Math.floor(Math.random()*shirts.length)]);if(big){d.style.transform="scale(1.35)";d.style.zIndex=30}d.innerHTML='<div class="arm a"></div><div class="arm b"></div><div class="body"></div><div class="leg a"></div><div class="leg b"></div><div class="head">'+faces[Math.floor(Math.random()*faces.length)]+'</div>';crowd.appendChild(d);events++;if(crowd.children.length>42)crowd.firstChild.remove();document.getElementById("count").textContent="🔥 "+events+" EVENTS • DJ PYKAY LIVE"}
function particle(icon,n=8){for(let i=0;i<n;i++){const p=document.createElement("div");p.className="fx";p.textContent=icon;p.style.left=(3+Math.random()*92)+"%";p.style.bottom=(5+Math.random()*25)+"%";p.style.animationDelay=(Math.random()*.35)+"s";document.getElementById("stage").appendChild(p);setTimeout(()=>p.remove(),2100)}}
function bang(text){banner.textContent=text;banner.classList.remove("show");void banner.offsetWidth;banner.classList.add("show")}function blink(){flash.classList.remove("flash");void flash.offsetWidth;flash.classList.add("flash")}for(let i=0;i<18;i++)addMeme();
socket.on("status",d=>{if(d.connected){dot.classList.add("connected");statusText.textContent="LIVE • @"+d.user}else{dot.classList.remove("connected");statusText.textContent="Đang kết nối TikTok..."}});
socket.on("tiktok",d=>{if(d.type==="comment"){addMeme();particle("✨",4)}if(d.type==="like")particle("❤️",7);if(d.type==="gift"){addMeme(true);blink();particle("🌹",12);particle("🔥",8);bang("🎁 QUẨY LÊN! 🔥")}if(d.type==="follow"){addMeme(true);particle("👑",9);bang("👑 NEW FOLLOW!")}if(d.type==="social"&&String(d.action||"").toLowerCase().includes("follow")){addMeme(true);particle("👑",9);bang("👑 NEW FOLLOW!")}})
</script></body></html>
